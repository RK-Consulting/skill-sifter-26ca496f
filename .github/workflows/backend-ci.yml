name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DB_HOST: localhost
  TEST_DB_PORT: 5432
  TEST_DB_USER: postgres
  TEST_DB_PASSWORD: postgres
  TEST_DB_NAME: skillsifter_test

jobs:
  format:
    name: Go Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          gofmt -d handlers/subscription_handlers.go
          exit 1

  build:
    name: Go Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Build
        run: go build ./...

  vet:
    name: Go Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Vet
        run: go vet ./...

  test:
    name: Go Test & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: skillsifter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d skillsifter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false

      - name: Validate schema definitions
        run: go test ./db -run 'Test(DiscoverSchemaDefinitions|InitializeSchema)' -count=1

      - name: Test with coverage
        run: go test -p 1 ./... -coverprofile=coverage.out -covermode=atomic

      - name: Publish coverage summary
        shell: bash
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "### Backend coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "Total statement coverage: **$total**" >> "$GITHUB_STEP_SUMMARY"
