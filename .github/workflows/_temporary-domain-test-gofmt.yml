name: Temporary Domain Test Gofmt
on:
  push:
    branches:
      - feature/recruitment-state-model
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Format
        working-directory: backend
        run: gofmt -w domain/screening/service_test.go domain/submission/service_test.go
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/domain/screening/service_test.go backend/domain/submission/service_test.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style: gofmt domain service tests"
          git push
