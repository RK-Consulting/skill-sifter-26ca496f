name: Phase 9 Production Mutation Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Deployed SkillSifter URL'
        required: true
        default: 'https://skillsifter.in'
        type: string

permissions:
  contents: read

concurrency:
  group: phase9-production-mutation-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    name: Browser Production Mutation Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_TEST_BASE_URL: ${{ inputs.base_url || 'https://skillsifter.in' }}
      E2E_API_BASE_URL: https://api.skillsifter.in
      E2E_ADMIN_EMAIL: ${{ secrets.SKILLSIFTER_E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.SKILLSIFTER_E2E_ADMIN_PASSWORD }}
      E2E_RUN_MUTATIONS: 'true'
      SMOKE_SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Verify production smoke credentials
        shell: bash
        run: |
          test -n "$E2E_ADMIN_EMAIL" || { echo "SKILLSIFTER_E2E_ADMIN_EMAIL is not configured."; exit 1; }
          test -n "$E2E_ADMIN_PASSWORD" || { echo "SKILLSIFTER_E2E_ADMIN_PASSWORD is not configured."; exit 1; }
          test "$E2E_ADMIN_EMAIL" = "e2e-admin@skillsifter.in" || { echo "Unexpected E2E smoke account."; exit 1; }

      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify smoke source commit
        shell: bash
        run: |
          checked_out_sha=$(git rev-parse HEAD)
          echo "Smoke trigger SHA: $SMOKE_SOURCE_SHA"
          echo "Checked-out SHA:  $checked_out_sha"
          test "$checked_out_sha" = "$SMOKE_SOURCE_SHA" || {
            echo "Smoke source SHA mismatch."
            exit 1
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm install

      - name: Install Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Wait for deployed frontend
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --location --max-time 15 "$PLAYWRIGHT_TEST_BASE_URL/" >/dev/null; then
              echo "Frontend is reachable."
              exit 0
            fi
            echo "Frontend not ready yet (attempt $attempt/20); waiting 15 seconds..."
            sleep 15
          done
          echo "Frontend did not become reachable within 5 minutes."
          exit 1

      - name: Verify deployed revision and reset preflight contract
        shell: bash
        run: |
          expected_version="$(cat VERSION)"
          for attempt in {1..20}; do
            health_payload="$(curl --fail --silent --show-error --max-time 10 "$E2E_API_BASE_URL/api/health-check" 2>/dev/null || true)"
            health_status="$(printf '%s' "$health_payload" | jq -r '.status // empty' 2>/dev/null || true)"
            health_version="$(printf '%s' "$health_payload" | jq -r '.version // empty' 2>/dev/null || true)"
            deployed_revision="$(printf '%s' "$health_payload" | jq -r '.revision // empty' 2>/dev/null || true)"
            reset_status=$(curl --max-time 10 -sS -o /dev/null -w '%{http_code}' -X OPTIONS "$E2E_API_BASE_URL/api/e2e/reset" || true)
            if [[ "$health_status" == "OK" && "$health_version" == "$expected_version" && "$deployed_revision" == "$SMOKE_SOURCE_SHA" && "$reset_status" == "204" ]]; then
              echo "Deployed version $health_version and revision $deployed_revision match the checked-out smoke source; reset preflight is healthy."
              exit 0
            fi
            echo "Deployment not ready (attempt $attempt/20; status=$health_status version=$health_version revision=$deployed_revision expected=$SMOKE_SOURCE_SHA reset=$reset_status); waiting 15 seconds..."
            sleep 15
          done
          echo "Production backend revision did not match the smoke source within 5 minutes. No mutation tests were run."
          exit 1

      - name: Verify production E2E smoke account credentials
        shell: bash
        run: |
          payload=$(jq -n --arg email "$E2E_ADMIN_EMAIL" --arg password "$E2E_ADMIN_PASSWORD" '{email:$email,password:$password}')
          response=$(curl --fail --silent --show-error --max-time 20 \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$E2E_API_BASE_URL/api/auth/login")
          echo "$response" | jq -e '.success == true and (.data.token | type == "string" and length > 0) and .data.user.role == "admin"' >/dev/null
          echo "Production E2E smoke account login verified."

      - name: Run production mutation smoke
        working-directory: e2e
        run: npm run smoke

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase9-production-mutation-smoke-report
          path: e2e/playwright-report/
          retention-days: 30
