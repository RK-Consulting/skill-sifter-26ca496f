version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: skillsifter-db
    environment:
      POSTGRES_DB: skillsifter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillsifter-api
    environment:
      - PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=skillsifter
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set — see deployment environment}
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - RESUME_STORAGE_PATH=/app/storage/resumes
      - DOCKER_ENV=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - resumes:/app/storage/resumes
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillsifter-client
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  resumes:
